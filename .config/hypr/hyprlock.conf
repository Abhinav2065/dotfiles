# Hyprlock Configuration
# Minimalist Monochrome Theme with 3D Rotating ASCII Donut

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    text_trim = false
}

background {
    monitor =
    color = rgb(255, 255, 255)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(0, 0, 0)
    font_size = 38
    font_family = JetBrainsMono Nerd Font Propo Bold
    position = 0, 240
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%A, %B %d")"
    color = rgb(110, 110, 110)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 195
    halign = center
    valign = center
}

# 3D Rotating ASCII Donut
label {
    monitor =
    text = cmd[update:60] /home/ablag/.config/hypr/scripts/donut
    color = rgb(0, 0, 0)
    font_size = 9
    font_family = DejaVu Sans Mono
    text_align = left
    position = 0, 10
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(0, 0, 0)
    inner_color = rgb(255, 255, 255)
    font_color = rgb(0, 0, 0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">password</span>
    hide_input = false
    rounding = 0
    check_color = rgb(100, 100, 100)
    fail_color = rgb(0, 0, 0)
    fail_text = <span foreground="##000000">authentication failed</span>
    capslock_color = rgb(120, 120, 120)
    position = 0, -200
    halign = center
    valign = center
}
