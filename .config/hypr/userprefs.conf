# Set your personal hyprland configuration here
# for sample file, please refer https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

exec-once = ~/.config/hypr/scripts/video-wallpaper.sh

# Laptop Mode: Initialize mode (PC Mode with hypridle or Server Mode)
exec-once = ~/.config/waybar/scripts/laptop-mode.sh init

# Lid Switch handling for PC Mode and Server Mode
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-handler.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-handler.sh open

# Lock Screen keybindings (Super+L and Ctrl+Alt+L)
bind = $mainMod, L, exec, pidof hyprlock || hyprlock
bind = $CONTROL ALT, L, exec, pidof hyprlock || hyprlock

# Window borders and gaps - Monochrome Black & White
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(ffffffff) rgba(777777ff) 45deg
    col.inactive_border = rgba(222222cc)
}

group {
    col.border_active = rgba(ffffffff) rgba(777777ff) 45deg
    col.border_inactive = rgba(222222cc)
    col.border_locked_active = rgba(ffffffff) rgba(777777ff) 45deg
    col.border_locked_inactive = rgba(222222cc)
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# Restart waybar to ensure it runs on startup
exec-once = bash -c 'sleep 2 && killall waybar; waybar &'
